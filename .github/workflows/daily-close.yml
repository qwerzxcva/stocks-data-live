# 每日收盘后完整统计 (交易日 15:30 CST = 7:30 UTC)
# 私有仓免费额度内 (~2 分钟/次, 22 天 ≈ 44 分钟/月)
name: daily-close
on:
  schedule:
    - cron: '30 7 * * 1-5'  # 工作日 15:30 CST
  workflow_dispatch: {}
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { token: ${{ secrets.GITHUB_TOKEN }} }
      - uses: actions/checkout@v4
        with:
          repository: qwerzxcva/stocks-tools
          path: tools-repo
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with: { python-version: '3.x' }
      - name: Daily close analysis
        env:
          STOCKS_ROOT: ${{ github.workspace }}/tools-repo
          STOCKS_LIVE: ${{ github.workspace }}/data
          STOCKS_ANA: ${{ github.workspace }}
        run: |
          python3 tools-repo/tools/refresh_pool.py
          python3 tools-repo/tools/analyze_today.py
          python3 tools-repo/tools/monitor.py
      - name: Commit & push
        run: |
          git config user.name "stocks-bot"
          git config user.email "41888888888+stocks-bot@users.noreply.github.com"
          git add -A
          ts=$(TZ=Asia/Shanghai date '+%Y%m%d_%H%M')
          git diff --quiet HEAD && echo "no changes" || {
            git commit -m "daily-close $ts" && \
            git -c http.version=HTTP/1.1 push origin main
          }
