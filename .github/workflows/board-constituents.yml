# board-constituents.yml — collect eastmoney board membership from the Actions
# egress and publish it to the data warehouse.
#
# Why here: the eastmoney board endpoint (clist?fs=b:<BK>) refuses connections
# from the local container per-IP, and swapping hosts (push2his / push2delay /
# push2ex) does not help. The Actions runner's North-America egress reaches it
# fine. This workflow fetches there and pushes the result into
# jiegengxiangjianxue1/db-market, so nothing local hammers a blocked host.
#
# The collector probes its endpoint list first and exits 2 when none answer, so
# a blocked run fails loudly instead of publishing 200 empty files.
#
# 200 boards at ~0.15s each plus retries: ~5 minutes.
name: board-constituents
on:
  schedule:
    # 06:20 CST weekdays, before the open (22:20 UTC the previous day)
    - cron: '20 22 * * 0-4'
  workflow_dispatch: {}
permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Shanghai
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Sync remote main
        run: |
          git fetch origin main
          git merge --ff-only origin/main || echo "already up to date"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The board list lives in the warehouse; pull it instead of re-scraping.
      - name: Fetch board lists from the warehouse
        run: |
          mkdir -p data/sector
          for kind in industry concept; do
            curl -s -H "Authorization: token ${GH_TOKEN}" \
              "https://api.github.com/repos/jiegengxiangjianxue1/db-market/contents/sector/${kind}.json" \
              | python3 -c "
          import json,sys,base64
          d=json.load(sys.stdin)
          if 'content' not in d:
              print('missing', d.get('message')); sys.exit(1)
          open('data/sector/${kind}.json','wb').write(base64.b64decode(d['content']))
          print('got ${kind}.json')
          " || exit 1
          done

      - name: Collect memberships (endpoint auto-switch)
        run: |
          set -o pipefail
          python3 scripts/refetch_constituents.py 2>&1 | tee /tmp/cons.log

      - name: Rebuild stock -> board index
        run: python3 scripts/build_stock_board_index.py || echo "index skipped"

      - name: Publish to the warehouse
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          python3 scripts/publish_constituents.py || exit 1

      - name: Summary
        run: |
          for kind in industry concept; do
            n=$(ls data/sector/${kind}_constituents 2>/dev/null | wc -l)
            filled=$(python3 -c "
          import glob,json
          n=0
          for f in glob.glob('data/sector/${kind}_constituents/*.json'):
              try:
                  if json.load(open(f)).get('members'): n+=1
              except Exception: pass
          print(n)
          ")
            echo "${kind}: ${n} files, ${filled} with members"
          done
          head -c 400 data/sector/stock_to_board.json 2>/dev/null; echo
