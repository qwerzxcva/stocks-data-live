# K线长跑补录 — 用 Actions 兜底 (Codespaces 不可用时)
# 每 6 小时跑一轮, 每轮最多 5.5 小时, 断点续传
# 目标: 覆盖率 74.8% → 99%+ (缺口 1346 只, 腾讯接口实测 96.9% 可达)
#
# 2026-10-15 重写。原版本有三个致命问题导致它从未真正工作过:
#   1. `workflow_dispatch: {}` 后跟 `inputs:` 缩进块, YAML 解析直接报错,
#      整个 workflow 作废 — 上线后 10 次运行全部 failure, cron 从未触发。
#   2. universe.csv 和 _progress.json 从未 checkout, load_universe() 返回
#      空列表, todo=0, 脚本打印「已全覆盖 ✅」后退出 — 假阳性, 看着像成功。
#   3. 写回目标是分片仓 day_qfq/ (只有 238 只的桶), 且 cp -n 不覆盖已有
#      文件 — 即使前两条修好, 数据也写不进去。
#
# 现在: 脚本从本仓取, 数据直接读写 stocks-data-kline 主仓, 不经分片中转。
name: kline-longrun
on:
  schedule:
    - cron: '0 2,8,14,20 * * *'   # 每天4轮 (UTC 10/16/22/02 CST)
  workflow_dispatch:
    inputs:
      max_hours:
        description: '本轮最长运行小时数'
        default: '5'
        required: false
permissions:
  contents: write
concurrency:
  # 相邻两轮间隔 6h, 单轮上限 5.5h, 理论有 0.5h 重叠窗口。
  # 不取消在跑的: 长跑任务被顶掉会丢一整轮进度。
  group: kline-longrun
  cancel-in-progress: false
jobs:
  longrun:
    runs-on: ubuntu-latest
    timeout-minutes: 355      # Actions 上限 6h, 留 5 分钟余量
    env:
      TZ: Asia/Shanghai
      STOCKS_KLINE_BULK: ${{ github.workspace }}/kline-repo/data/bulk
    steps:
      # 本仓: 提供 scripts/longrun_collect.py
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      # 主仓: universe + progress + 采集结果都在 data/bulk 下
      - uses: actions/checkout@v4
        with:
          repository: qwerzxcva/stocks-data-kline
          token: ${{ secrets.GH_TOKEN }}
          path: kline-repo
          fetch-depth: 0

      - name: Sync kline repo to remote tip
        run: |
          cd kline-repo
          git fetch origin main
          git reset --hard origin/main
          echo "bulk files: $(ls data/bulk/ | wc -l)"
          echo "universe: $(grep -vc '^#' data/bulk/universe.csv)"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Longrun kline collect (resumable)
        run: |
          python3 scripts/longrun_collect.py kline \
            --max-hours ${{ github.event.inputs.max_hours || '5' }} || true

      - name: Report coverage
        run: |
          python3 -c "
          import glob, os
          bulk = os.environ['STOCKS_KLINE_BULK']
          uni = set()
          for line in open(os.path.join(bulk, 'universe.csv'), encoding='utf-8', errors='replace'):
              line = line.strip()
              if line and not line.startswith('#') and '|' in line:
                  uni.add(line.split('|')[0].strip())
          have = set()
          for p in glob.glob(os.path.join(bulk, 'day_qfq_*.csv')):
              with open(p, encoding='utf-8', errors='replace') as f:
                  for line in f:
                      line = line.strip()
                      if line and not line.startswith('#') and '|' in line:
                          have.add(line.split('|')[0].strip())
          print(f'covered: {len(have)}/{len(uni)} ({len(have)/max(len(uni),1)*100:.1f}%)')
          print(f'missing: {len(uni - have)}')
          "

      # 只提交采集产物。reset --soft 把基线移到远端最新但保留工作区改动,
      # 这样别的工作流这期间推的新数据不会被本 run 的旧副本覆盖。
      - name: Commit & push new klines
        run: |
          cd kline-repo
          git config user.name "longrun-bot"
          git config user.email "741059079@qq.com"
          git fetch origin main
          git reset --soft origin/main
          git add data/bulk/day_qfq_recent.csv data/bulk/_longrun_progress.json
          ts=$(TZ=Asia/Shanghai date '+%Y%m%d_%H%M')
          if git diff --cached --quiet HEAD; then
            echo "no changes"
          else
            git commit -m "kline-longrun: $ts" || echo "commit failed"
            git -c http.version=HTTP/1.1 push origin main || {
              echo "push raced, retrying once"
              git fetch origin main
              git reset --soft origin/main
              git add data/bulk/day_qfq_recent.csv data/bulk/_longrun_progress.json
              git commit -m "kline-longrun: $ts" 2>/dev/null || true
              git push origin main || echo "push failed again, next run continues"
            }
          fi

      - name: Summary
        run: |
          {
            echo "## kline-longrun $(TZ=Asia/Shanghai date '+%H:%M:%S')"
            echo "- recent.csv: $(wc -l < kline-repo/data/bulk/day_qfq_recent.csv 2>/dev/null || echo 0) lines"
          } >> $GITHUB_STEP_SUMMARY
